name: Secret Scan

# This repo has no pr.yaml caller, so it gets no secret scanning from the shared workflow.
# It is public, so a leaked credential here is exposed immediately.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  secret-scan:
    uses: Stellar-Fusion/devops-tools/.github/workflows/secret-scan.yaml@v1
