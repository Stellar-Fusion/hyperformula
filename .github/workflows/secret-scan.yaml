name: Secret Scan

# Inlined copy of Stellar-Fusion/devops-tools/.github/workflows/secret-scan.yaml (main, 2026-10-08).
# This repo is public, and a public repo cannot call a reusable workflow from the private
# devops-tools repo, so the job is copied here. Keep the gitleaks version, checksum and rules in
# step with the shared workflow when it changes.
#
# To silence a false positive, add its fingerprint to .gitleaksignore or put a `gitleaks:allow`
# comment on the line.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Write gitleaks config
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          title = "Stellar Fusion secret scan"

          [extend]
          useDefault = true

          [[rules]]
          id = "connection-string-password"
          description = "Inline password in a database or broker connection string"
          regex = '''(?i)\b(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|amqps?|rediss?|mssql|sqlserver)://[^:/\s@'"]+:([^@\s'"<>{}$]{6,})@'''
          secretGroup = 1
          keywords = ["mongodb", "postgres", "mysql", "mariadb", "amqp", "redis", "mssql", "sqlserver"]

          [[rules]]
          id = "cli-password-flag"
          description = "Literal password passed as a command-line flag"
          regex = '''(?i)(?:^|\s)--pass(?:word|wd)?[ =]['"]?([^\s'"<>{}$\\*]{8,})'''
          secretGroup = 1
          keywords = ["--pass"]

          [[rules]]
          id = "kubectl-from-literal-secret"
          description = "Literal credential in kubectl create secret --from-literal"
          regex = '''(?i)--from-literal=[\w.-]*(?:pass|pwd|secret|token|key)[\w.-]*=['"]?([^\s'"<>{}$\\]{6,})'''
          secretGroup = 1
          keywords = ["--from-literal"]

          [[rules]]
          id = "htpasswd-hash"
          description = "htpasswd / crypt password hash (crackable offline)"
          regex = '''(?m)^[\w.@-]+:(\$(?:apr1|2[abxy]?|5|6)\$[./0-9A-Za-z$]{20,}|\{SHA\}[A-Za-z0-9+/]{27}=)'''
          secretGroup = 1
          keywords = ["$apr1$", "$2a$", "$2b$", "$2y$", "$5$", "$6$", "{sha}"]
          TOML

      - name: Scan introduced commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]]; then
            log_opts="${PUSH_BEFORE_SHA}..${HEAD_SHA}"
          else
            # Manual runs, new branches and non-PR callers: scan the checked-out tree.
            echo "Scanning working tree (event: $EVENT_NAME)"
            gitleaks dir . --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner --verbose
            exit 0
          fi

          echo "Scanning commits $log_opts"
          gitleaks git . --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="$log_opts" --redact --no-banner --verbose
